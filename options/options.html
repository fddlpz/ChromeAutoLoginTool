<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动登录助手设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">Chrome Extension</p>
          <h1>自动登录助手</h1>
          <p class="intro">
            为多个系统维护登录规则，进入目标页面后自动填充账号密码并提交。
          </p>
        </div>
        <div class="hero-actions">
          <label class="toggle-card">
            <span>全局启用</span>
            <input id="globalEnabled" type="checkbox" checked>
          </label>
          <button id="exportButton" class="secondary" type="button">导出配置</button>
          <button id="importButton" class="secondary" type="button">导入配置</button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
      </section>

      <section class="layout">
        <section class="panel form-panel">
          <div class="section-head">
            <div>
              <h2 id="formTitle">新增规则</h2>
              <p>一条规则可以匹配多个登录页，每行一个 URL 模式。</p>
            </div>
            <div class="stats" id="ruleStats">0 条规则</div>
          </div>

          <form id="ruleForm" class="rule-form">
            <input id="ruleId" type="hidden">

            <label>
              <span>规则名称</span>
              <input id="name" type="text" placeholder="例如：OA 登录" required>
            </label>

            <label>
              <span>目标 URL 模式</span>
              <textarea id="urlPatterns" rows="4" placeholder="每行一个，例如：&#10;https://oa.example.com/login*&#10;https://oa.example.com/sso/*" required></textarea>
            </label>

            <div class="grid two-cols">
              <label>
                <span>账号输入框选择器</span>
                <input id="usernameSelector" type="text" placeholder="#username" required>
              </label>
              <label>
                <span>账号值</span>
                <input id="usernameValue" type="text" placeholder="your.account" required>
              </label>
            </div>

            <div class="grid two-cols">
              <label>
                <span>密码输入框选择器</span>
                <input id="passwordSelector" type="text" placeholder="#password" required>
              </label>
              <label>
                <span>密码值</span>
                <input id="passwordValue" type="password" placeholder="your.password" required>
              </label>
            </div>

            <div class="grid two-cols">
              <label>
                <span>提交按钮选择器</span>
                <input id="submitSelector" type="text" placeholder="button[type='submit']">
              </label>
              <label>
                <span>表单选择器</span>
                <input id="formSelector" type="text" placeholder="form.login-form">
              </label>
            </div>

            <div class="grid two-cols">
              <label>
                <span>已登录标识选择器</span>
                <input id="alreadyLoggedInSelector" type="text" placeholder=".user-avatar">
              </label>
              <label>
                <span>高级附加字段 JSON</span>
                <textarea id="extraFields" rows="3" placeholder='例如：[{"selector":"#tenant","value":"acme"}]'></textarea>
              </label>
            </div>

            <div class="grid two-cols">
              <label>
                <span>等待表单超时（毫秒）</span>
                <input id="waitTimeoutMs" type="number" min="0" step="100" value="15000">
              </label>
              <label>
                <span>提交前延迟（毫秒）</span>
                <input id="submitDelayMs" type="number" min="0" step="100" value="400">
              </label>
            </div>

            <label>
              <span>备注</span>
              <textarea id="notes" rows="3" placeholder="记录选择器来源、适用环境或注意事项。"></textarea>
            </label>

            <div class="check-grid">
              <label class="inline-check">
                <input id="enabled" type="checkbox" checked>
                <span>启用该规则</span>
              </label>
              <label class="inline-check">
                <input id="autoSubmit" type="checkbox" checked>
                <span>填充后自动提交</span>
              </label>
            </div>

            <div class="form-actions">
              <button class="primary" type="submit">保存规则</button>
              <button id="resetButton" class="ghost" type="button">清空表单</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="section-head">
            <div>
              <h2>当前规则</h2>
              <p>按列表顺序匹配，命中第一条规则后执行。</p>
            </div>
          </div>
          <div id="ruleList" class="rule-list empty">
            <p>还没有规则，先在左侧新增一条吧。</p>
          </div>
        </section>
      </section>
    </main>

    <script src="../shared/config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
